[project]
name = "catchdev"
version = "0.1.0"
description = "Tells you what your AI coding agent just broke"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["httpx", "rich", "click"]

[project.scripts]
catch = "catchdev.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
